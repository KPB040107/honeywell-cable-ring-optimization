[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resplan-router"
version = "0.1.0"
description = "Joint Optimization of Control-Panel Placement and Closed-Loop Cable Routing (Version 1 Foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ResPlan Routing Team"}
]
dependencies = [
    "pydantic>=2.6.0",
    "shapely>=2.0.2",
    "networkx>=3.2.1",
    "ortools>=9.8.3296",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "pulp>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
