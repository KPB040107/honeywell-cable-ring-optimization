name: CI

on:
  push:
    branches:
      - main
      - master
      - 'phase**'
  pull_request:
    branches:
      - main
      - master
      - 'phase**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install core build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Install dependencies and package in editable mode
        run: |
          python -m pip install -e ".[test,dev]"

      - name: Code hygiene and linting checks
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Prepare test dataset fixture
        run: |
          python scripts/generate_ci_dataset.py

      - name: Run pytest test suite
        run: |
          pytest tests/ -v --maxfail=5

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify build artifacts exist
        shell: bash
        run: |
          ls -la dist/
          test -f dist/*.whl
          test -f dist/*.tar.gz

      - name: Smoke test wheel installation in clean environment
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          resplan --help
          python -c "import resplan_router; print('Installed ResPlan Router successfully'); print('Version:', getattr(resplan_router, '__version__', '2.0.0'))"
